<VirtualHost *:80>
    ServerAdmin damir-82@bk.ru
    ServerName amina.tatar
    ServerAlias www.amina.tatar
    DocumentRoot /var/www/html/amina.tatar/build

    DirectoryIndex index.html

    <Directory /var/www/html/amina.tatar/build>
        Options -Indexes
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteRule ^(multfilm|songs|songs_text|songs_minuses|news|about|method)/?$ /seo/$1.html [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L,QSA]

        <FilesMatch "\.(?:css|js|png|jpe?g|gif|svg|webp|ico|woff2?)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>
        <Files "index.html">
            Header set Cache-Control "no-cache, no-store, must-revalidate"
        </Files>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/amina.tatar_error.log
    CustomLog ${APACHE_LOG_DIR}/amina.tatar_access.log combined

    RewriteEngine on
    RewriteRule ^ https://amina.tatar%{REQUEST_URI} [END,NE,R=301]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin damir-82@bk.ru
    ServerName amina.tatar
    ServerAlias www.amina.tatar
    DocumentRoot /var/www/html/amina.tatar/build

    <Directory /var/www/html/amina.tatar/build>
        Options -Indexes
        AllowOverride None
        Require all granted
        
        RewriteEngine On
        RewriteRule ^(multfilm|songs|songs_text|songs_minuses|news|about|method)/?$ /seo/$1.html [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L,QSA]

        <FilesMatch "\.(?:css|js|png|jpe?g|gif|svg|webp|ico|woff2?)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>
        <Files "index.html">
            Header set Cache-Control "no-cache, no-store, must-revalidate"
        </Files>
    </Directory>

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Content-Language "tt"

    ErrorLog ${APACHE_LOG_DIR}/amina.tatar-ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/amina.tatar-ssl_access.log combined

    SSLCertificateFile /etc/letsencrypt/live/amina.tatar/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/amina.tatar/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    RewriteEngine on
    RewriteCond %{HTTP_HOST} !^amina\.tatar$ [NC]
    RewriteRule ^ https://amina.tatar%{REQUEST_URI} [END,NE,R=301]
</VirtualHost>
</IfModule>
