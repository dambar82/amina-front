<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Мультфильмы, песни, новости от Амины"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Amina</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Yandex.Metrika: скрипт для программ, которые читают HTML -->
    <script
      async
      src="https://mc.yandex.ru/metrika/tag.js?id=104397259"
    ></script>

    <!-- Инициализация со страховкой: если ym ещё не определён, попробуем через таймаут -->
    <script type="text/javascript">
      (function initYm() {
        function doInit() {
          try {
            ym(104397259, "init", {
              clickmap: true,
              trackLinks: true,
              accurateTrackBounce: true,
              webvisor: true,
              ecommerce: "dataLayer",
            });
          } catch (e) {
            // если что-то пойдет не так — просто игнорируем ошибку
            console && console.error && console.error("YM init error:", e);
          }
        }

        if (typeof ym === "function") {
          doInit();
        } else {
          // ждем загрузки tag.js (повтор каждые 50ms, максимум ~5 сек)
          var tries = 0;
          var t = setInterval(function () {
            tries++;
            if (typeof ym === "function") {
              clearInterval(t);
              doInit();
            }
            if (tries > 100) {
              // 100 * 50ms = 5000ms
              clearInterval(t);
            }
          }, 50);
        }
      })();
    </script>

    <!-- noscript для сканеров и пользователей без JS -->
    <noscript>
      <div>
        <img
          src="https://mc.yandex.ru/watch/104397259"
          style="position: absolute; left: -9999px"
          alt=""
        />
      </div>
    </noscript>
    <!-- /Yandex.Metrika counter -->
  </body>
</html>
