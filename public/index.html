<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Амина</title>
  </head>
  <body>
    <noscript>Включите JavaScript для корректной работы приложения.</noscript>
    <div id="root"></div>

    <script type="text/javascript">
      (function (w) {
        if (typeof w.ym === "function") return; // если уже есть
        w.ym = function () {
          (w.ym.q = w.ym.q || []).push(arguments);
        };
        w.ym.l = +new Date();
        w.__ym_test_stub_present = true;
      })(window);

      try {
        ym(104397259, "init", {
          clickmap: true,
          trackLinks: true,
          accurateTrackBounce: true,
          webvisor: true,
          ecommerce: "dataLayer",
        });
      } catch (e) {
        // noop — в тестовом окружении ошибок не будет, но на всякий случай
        console && console.warn && console.warn("ym queue error:", e);
      }
    </script>

    <!-- Подключаем официальный tag.js (асинхронно). -->
    <script
      async
      src="https://mc.yandex.ru/metrika/tag.js?id=104397259"
    ></script>

    <!-- Носкрипт пиксель (для клиентов/сканеров, которые не выполняют JS) -->
    <noscript>
      <div>
        <img
          src="https://mc.yandex.ru/watch/104397259"
          style="position: absolute; left: -9999px"
          alt=""
        />
      </div>
    </noscript>

    <!-- Простой скрипт для быстрой проверки (не обязателен) -->
    <script>
      // Для отладки: через пару сотен миллисекунд проверим, что ym существует.
      setTimeout(function () {
        console.log("typeof ym ->", typeof window.ym);
        // Если real tag.js загрузился и инициализировал счётчик, queue должен быть обработан.
        if (window.ym && window.ym.q && window.ym.q.length) {
          console.log("ym queue length:", window.ym.q.length);
        }
      }, 300);
    </script>
  </body>
</html>
